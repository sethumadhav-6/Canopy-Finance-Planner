name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}     # lets you trigger a build manually from the Actions tab

jobs:
  build:
    # Pinned to a specific Ubuntu LTS version, not "ubuntu-latest" -- floating onto
    # whatever Ubuntu ships next is exactly what broke the previous Docker-based
    # build (a third-party PPA hadn't caught up with a brand-new Ubuntu codename).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installed via GitHub's own action (Temurin builds), not an apt PPA --
      # avoids depending on any third party keeping pace with Ubuntu releases.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential
          # aidl (an Android build-tools binary python-for-android needs) is a 32-bit
          # executable -- on a 64-bit runner it silently fails to run without these
          # i386 compatibility libs, which p4a then reports as "Aidl not found".
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 libncurses5:i386 zlib1g:i386

      - name: Install buildozer
        run: pip install --upgrade pip "Cython==0.29.33" buildozer

      # Caches the Android SDK/NDK download + compiled recipes across runs so
      # repeat builds after this first one take minutes, not tens of minutes.
      - name: Cache buildozer downloads and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canopy-finance-debug-apk
          path: bin/*.apk
