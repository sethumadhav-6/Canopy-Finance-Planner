name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}     # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs the whole Android SDK/NDK toolchain + buildozer inside GitHub's
      # cloud runner -- nothing needs to be installed on your own machine.
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: .
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canopy-finance-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
